<!DOCTYPE html>
<html>

<head>
    <title>License Admin</title>

    <style>
        body {
          font-family: Arial;
          background: #0f172a;
          color: white;
          padding: 20px;
        }

        button {
          padding: 10px 15px;
          margin: 5px;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          background: #2563eb;
          color: white;
        }

        button.danger {
          background: #b91c1c;
        }

        table {
          width: 100%;
          margin-top: 20px;
          border-collapse: collapse;
        }

        th, td {
          padding: 10px;
          border: 1px solid #333;
          text-align: center;
        }

        .revoked { color: red; }
        .active { color: lightgreen; }
        .expired { color: orange; }
        .lifetime { color: cyan; font-weight: bold; }

        input {
          padding: 8px;
          margin: 0;
          width: 120px;
          border-radius: 4px;
          border: 1px solid #333;
        }

        .name-cell {
          display: flex;
          gap: 4px;
          justify-content: center;
          align-items: center;
        }

        .name-cell button {
          padding: 6px 10px;
          margin: 0;
        }

        .tabs {
          margin-top: 10px;
        }

        .tab-btn {
          background: #1e293b;
          opacity: 0.7;
        }

        .tab-btn.active {
          background: #2563eb;
          opacity: 1;
        }

        .tab-panel {
          border: 1px solid #1e293b;
          border-radius: 8px;
          padding: 15px;
          margin-top: 10px;
        }
    </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginBox">
    <h3>🔐 Admin Login</h3>
    <input id="password" type="password" placeholder="Enter password">
    <button onclick="login()">Login</button>
</div>

<!-- 🔥 DASHBOARD -->
<div id="dashboard" style="display:none;">

    <h2>🔑 License Dashboard <button class="danger" onclick="logout()" style="float:right; font-size: 0.5em;">Logout</button></h2>

    <div class="tabs">
        <button class="tab-btn active" id="tabBtn-cdr_analyzer" onclick="switchTab('cdr_analyzer')">CDR Analyzer</button>
        <button class="tab-btn" id="tabBtn-extractor" onclick="switchTab('extractor')">Zooravar Extractor</button>
    </div>

    <div id="panel-cdr_analyzer" class="tab-panel">
        <button onclick="generate('cdr_analyzer', '30')">Generate 30 Days</button>
        <button onclick="generate('cdr_analyzer', '90')">Generate 90 Days</button>
        <button onclick="generate('cdr_analyzer', 'lifetime')">Lifetime</button>

        <h3 id="newKey-cdr_analyzer"></h3>

        <table>
            <thead>
            <tr>
                <th>Key</th>
                <th>Name</th>
                <th>Device</th>
                <th>Status</th>
                <th>Expiry</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="tableBody-cdr_analyzer"></tbody>
        </table>
    </div>

    <div id="panel-extractor" class="tab-panel" style="display:none;">
        <button onclick="generate('extractor', '30')">Generate 30 Days</button>
        <button onclick="generate('extractor', '90')">Generate 90 Days</button>
        <button onclick="generate('extractor', 'lifetime')">Lifetime</button>

        <h3 id="newKey-extractor"></h3>

        <table>
            <thead>
            <tr>
                <th>Key</th>
                <th>Name</th>
                <th>Device</th>
                <th>Status</th>
                <th>Expiry</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="tableBody-extractor"></tbody>
        </table>
    </div>

</div>

<script>

    const baseUrl = "https://cdr-license-server.onrender.com";

    // The password and the API key used to live here, in plain sight to anyone who opened
    // dev tools or viewed page source - that's gone now. All that's kept client-side is an
    // opaque, short-lived session token issued by POST /login after the real password check
    // happens server-side. sessionStorage (not localStorage) so it clears when the tab closes.
    let sessionToken = sessionStorage.getItem("session_token");

    function authHeaders(extra = {}) {
      return { "session-token": sessionToken, ...extra };
    }

    /// 🔐 LOGIN
    async function login() {

      const pass = document.getElementById("password").value;

      try {
        const res = await fetch(`${baseUrl}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pass })
        });

        if (!res.ok) {
          alert("Wrong password");
          return;
        }

        const data = await res.json();
        sessionToken = data.token;
        sessionStorage.setItem("session_token", sessionToken);
        showDashboard();

      } catch (e) {
        alert("Couldn't reach the server. Check your connection.");
      }
    }

    function showDashboard() {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      loadLicenses();
    }

    function logout() {
      sessionStorage.removeItem("session_token");
      sessionToken = null;
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
    }

    // Resume an existing session on page load/refresh, instead of asking for the password
    // again every time - loadLicenses() itself will bounce back to the login box via
    // handleAuthResponse() if this token has since expired or the server restarted.
    if (sessionToken) {
      showDashboard();
    }

    /// Centralizes the "session expired or invalid -> back to login" behavior so every
    /// fetch call below doesn't have to repeat it.
    async function handleAuthResponse(res) {
      if (res.status === 403) {
        alert("Your session expired. Please log in again.");
        logout();
        return null;
      }
      return res;
    }

    /// 🔀 TABS
    function switchTab(product) {
      for (const p of ["cdr_analyzer", "extractor"]) {
        document.getElementById(`panel-${p}`).style.display = (p === product) ? "block" : "none";
        document.getElementById(`tabBtn-${p}`).classList.toggle("active", p === product);
      }
    }

    /// 🔑 GENERATE
    async function generate(product, type) {

      let res = await fetch(`${baseUrl}/generate?type=${type}&product=${product}`, {
        headers: authHeaders()
      });
      res = await handleAuthResponse(res);
      if (!res) return;

      const data = await res.json();

      document.getElementById(`newKey-${product}`).innerText = "New Key: " + data.key;

      loadLicenses();
    }

    /// 📋 LOAD
    async function loadLicenses() {

      let res = await fetch(`${baseUrl}/licenses`, {
        headers: authHeaders()
      });
      res = await handleAuthResponse(res);
      if (!res) return;

      const data = await res.json();

      const bodies = {
        cdr_analyzer: document.getElementById("tableBody-cdr_analyzer"),
        extractor: document.getElementById("tableBody-extractor"),
      };
      bodies.cdr_analyzer.innerHTML = "";
      bodies.extractor.innerHTML = "";

      data.forEach(l => {

        // `statusClass` drives styling; `statusText` is what the cell actually SAYS - these
        // used to diverge (an expired key stayed colored orange but the cell still printed
        // the raw DB value "active", since expiry here is a derived/computed state, never
        // written back to `status` in Firestore). Keeping both in lockstep so the cell text
        // itself says "expired" rather than only hinting at it through color.
        let statusClass = "active";
        let statusText = l.status;
        let expiryText = "LIFETIME";
        let isExpired = false;

        if (l.status === "revoked") {
          statusClass = "revoked";
          statusText = "revoked";
        } else if (l.expiry) {

          const expiryDate = l.expiry._seconds
            ? new Date(l.expiry._seconds * 1000)
            : new Date(l.expiry);

          expiryText = expiryDate.toLocaleDateString();

          if (new Date() > expiryDate) {
            statusClass = "expired";
            statusText = "expired";
            isExpired = true;
          } else {
            statusClass = "active";
            statusText = "active";
          }

        } else {
          statusClass = "lifetime";
          statusText = "active";
        }

        // Pre-existing keys from before the `product` field existed are implicitly
        // CDR Analyzer keys (matches the server's own fallback logic in /activate).
        const product = l.product || "cdr_analyzer";
        const safeKey = l.key.replace(/'/g, "\\'");
        const body = bodies[product] || bodies.cdr_analyzer;

        const row = `
          <tr>
            <td>${l.key}</td>
            <td>
              <div class="name-cell">
                <input type="text" id="name-${l.key}" value="${(l.name || "").replace(/"/g, '&quot;')}" placeholder="Who holds this?">
                <button onclick="saveName('${safeKey}')">Save</button>
              </div>
            </td>
            <td>${l.device_id || "-"}</td>
            <td class="${statusClass}">${statusText}</td>
            <td>${expiryText}</td>
            <td>
              ${isExpired ? `<button onclick="renew('${safeKey}')">Renew</button>` : ""}
              <button onclick="revoke('${safeKey}')">Revoke</button>
              <button class="danger" onclick="deleteKey('${safeKey}')">Delete</button>
            </td>
          </tr>
        `;

        body.innerHTML += row;
      });
    }

    /// 🔁 RENEW
    async function renew(key) {

      const type = prompt('Renew for how long? Type "30", "90", or "lifetime":', "30");
      if (!type) return;

      if (!["30", "90", "lifetime"].includes(type)) {
        alert('Please type exactly "30", "90", or "lifetime".');
        return;
      }

      let res = await fetch(`${baseUrl}/renew`, {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ key, type })
      });
      res = await handleAuthResponse(res);
      if (!res) return;

      loadLicenses();
    }

    /// 📝 SAVE NAME
    async function saveName(key) {

      const input = document.getElementById(`name-${key}`);
      const name = input.value;

      const res = await fetch(`${baseUrl}/set-name`, {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ key, name })
      });
      await handleAuthResponse(res);
    }

    /// ❌ REVOKE
    async function revoke(key) {

      let res = await fetch(`${baseUrl}/revoke`, {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ key })
      });
      res = await handleAuthResponse(res);
      if (!res) return;

      loadLicenses();
    }

    /// 🗑️ DELETE
    async function deleteKey(key) {

      if (!confirm(`Permanently delete key ${key}? This can't be undone.`)) return;

      let res = await fetch(`${baseUrl}/delete`, {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ key })
      });
      res = await handleAuthResponse(res);
      if (!res) return;

      loadLicenses();
    }

    /// 🔄 AUTO REFRESH
    // Paused while logged out (no point hitting an endpoint that'll just 403) and while a
    // name input has focus, so typing isn't wiped out mid-edit by the periodic reload
    // racing the admin's keystrokes.
    setInterval(() => {
      if (!sessionToken) return;
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      loadLicenses();
    }, 5000);

</script>

</body>
</html>
